apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secrets-sync.fullname" . }}
  labels:
    {{- include "secrets-sync.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "secrets-sync.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "secrets-sync.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/app: {{ .Files.Get "files/app.py" | sha256sum }}
    spec:
      serviceAccountName: {{ include "secrets-sync.fullname" . }}-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/app.py"]
          env:
            - name: SECRET_NAME
              value: {{ .Values.secret.name | quote }}
            - name: SECRET_KEY
              value: {{ .Values.secret.key | quote }}
            - name: PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            periodSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: {{ include "secrets-sync.fullname" . }}-app
