apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "secrets-sync.fullname" . }}-secret-reader
  labels:
    {{- include "secrets-sync.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: [{{ .Values.secret.name | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "secrets-sync.fullname" . }}-secret-reader
  labels:
    {{- include "secrets-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "secrets-sync.fullname" . }}-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "secrets-sync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
